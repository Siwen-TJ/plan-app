<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>重塑计划表</title>
<meta name="description" content="紫色多巴胺 · 万年历计划表">
<meta name="theme-color" content="#7C3AED">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="计划表">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="app">

  <!-- ===== 今日 ===== -->
  <section class="view on" id="v-today">
    <header class="hero">
      <div class="hero-l">
        <div class="hd-date" id="tdDate">--月--日</div>
        <div class="hd-week" id="tdWeek">周-</div>
      </div>
      <div class="hero-r">
        <div class="hd-lunar" id="tdLunar">农历 --</div>
        <div class="hd-gz" id="tdGz">--</div>
      </div>
    </header>

    <div class="prog-card">
      <div class="prog-txt"><span>今日进度</span><b id="tdProgTxt">0 / 0</b></div>
      <div class="prog-bar"><i id="tdProgBar"></i></div>
    </div>

    <div class="sec-head">
      <h2>日常任务</h2>
      <button class="btn-add" id="tdAdd">＋ 添加</button>
    </div>
    <div class="tasklist" id="tdList"></div>

    <!-- 今日待办 -->
    <div class="sec-head">
      <h2>今日待办</h2>
      <button class="btn-add" id="tdTodoAdd">＋ 添加</button>
    </div>
    <div class="tasklist" id="tdTodoList"></div>

    <!-- 体重记录 -->
    <div class="sec-head page-head"><h2>体重记录</h2></div>
    <div class="wt-card">
      <div class="wt-row">
        <input type="number" step="0.1" inputmode="decimal" id="wtVal" placeholder="今日体重 kg">
        <button class="btn-add" id="wtAdd">记录</button>
      </div>
      <svg id="wtChart" viewBox="0 0 320 120" preserveAspectRatio="none"></svg>
      <div class="wt-kpis" id="wtKpis"></div>
      <div class="wt-history" id="wtHistory"></div>
    </div>

    <!-- 数据管理 -->
    <div class="sec-head page-head"><h2>数据</h2></div>
    <div class="me-card">
      <button class="me-btn" id="btnExport">⬆ 导出数据备份</button>
      <button class="me-btn" id="btnImport">⬇ 导入数据备份</button>
      <input type="file" id="fileImport" accept=".json,application/json" hidden>
      <button class="me-btn danger" id="btnClear">🗑 清空全部数据</button>
    </div>

    <!-- 安装到手机 -->
    <div class="sec-head page-head"><h2>安装到手机</h2></div>
    <div class="me-card install">
      <p><b>安卓（Chrome）：</b>用浏览器打开本页 → 点右上角 ⋮ →「添加到主屏幕 / 安装应用」。</p>
      <p><b>iPhone（Safari）：</b>点底部分享 ↑ →「添加到主屏幕」。</p>
      <p>安装后可离线使用，数据保存在本机。</p>
    </div>

    <p class="about">重塑计划表 v1.3.1 · 农历支持 1901–2100 · 数据仅存本机</p>
  </section>

  <!-- ===== 日历 ===== -->
  <section class="view" id="v-cal">
    <div class="cal-head">
      <button class="nav-btn" id="calPrev" aria-label="上个月">‹</button>
      <div class="cal-title" id="calTitle">2026年9月</div>
      <button class="nav-btn" id="calNext" aria-label="下个月">›</button>
    </div>
    <div class="cal-week">
      <span class="we">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="we">六</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-foot">
      <button class="btn-ghost" id="calToday">回到今天</button>
    </div>

    <div class="day-panel" id="dayPanel">
      <div class="dp-head">
        <div class="dp-date" id="dpDate">--</div>
        <div class="dp-lunar" id="dpLunar">--</div>
      </div>
      <div class="sec-head">
        <h2>To-do list</h2>
        <button class="btn-add" id="dpAdd">＋ 添加</button>
      </div>
      <div class="tasklist" id="dpList"></div>
    </div>
  </section>

</main>

<!-- ===== 底部导航 ===== -->
<nav class="tabbar" id="tabbar">
  <button class="tab" data-v="cal"><span class="ti">📅</span><span>日历</span></button>
  <button class="tab on" data-v="today"><span class="ti">☀</span><span>今日</span></button>
</nav>

<!-- ===== 底部弹层表单 ===== -->
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grip"></div>
  <h3 id="sheetTitle">添加任务</h3>
  <div id="sheetBody"></div>
  <div class="sheet-btns">
    <button class="btn-main" id="sheetOk">保存</button>
    <button class="btn-ghost" id="sheetCancel">取消</button>
  </div>
</div>

<script src="lunar.js"></script>
<script src="app.js"></script>
</body>
</html>
